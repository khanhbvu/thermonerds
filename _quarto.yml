project:
  type: website
  output-dir: _site

website:
  title: "Thermo Nerds"
  description: "Phase behaviour, equations of state, and the numerics behind them"
  # Required for RSS feeds and for canonical links to be correct.
  site-url: https://www.thermonerds.com
  navbar:
    right:
      - about.qmd
      # Uncomment once the repo exists, with your actual username:
      # - icon: github
      #   href: https://github.com/<username>/thermonerds

format:
  html:
    toc: true
    html-math-method: mathjax
    # Swap the second entry to try a different look. Options in themes/:
    #   themes/theme-preprint.scss   warm paper, serif, oxblood titles
    #   themes/theme-datum.scss      white, teal, sans headings, carded listing
    #   themes/theme-obsidian.scss   dark, cyan, mono headings
    #   themes/theme-ledger.scss     high contrast, heavy sans, red accent
    #   themes/theme-journal.scss    typeset paper: justified, indented, small caps
    #   themes/theme-lab.scss        engineering report: steel blue, boxed, striped
    #   themes/theme-monograph.scss  scholarly book: Spectral, airy, deep green
    #   themes/theme-eink.scss       e-reader panel: warm paper, greyscale, Literata
    theme:
      - cosmo
      - themes/theme-preprint.scss
    css: styles.css
    grid:
      # This site has no left sidebar, but Quarto reserves a column for one
      # anyway. At the 250px default it sits empty while the TOC fills the
      # right margin, which pushes the body right and leaves a wide blank
      # gutter on the left. Collapsing it centres the body+TOC block.
      sidebar-width: 0px
      # ~46rem of text at 19px root: a comfortable measure for derivations.
      body-width: 840px
      margin-width: 240px
      gutter-width: 1.5rem
    include-in-header:
      # Reader controls (colour themes + text size) in the navbar, beside the
      # site title. Palettes and the font-size scaling come from the ReadMode
      # extension. Underscore-prefixed so Quarto does not publish it as a page.
      - file: _reader.html
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400">
          <script>
            window.MathJax = {
              loader: { load: ['[tex]/mhchem'] },
              tex: {
                packages: { '[+]': ['mhchem'] },
                tags: 'ams',
                tagSide: 'right',
                macros: {
                  Vm:   "V_{m}",
                  kij:  "k_{ij}",
                  Rgas: "R"
                }
              }
            };
          </script>
